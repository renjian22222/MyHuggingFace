<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简在线白板</title>
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #f4f7f6;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        /* 工具栏样式 */
        .toolbar {
            background: #ffffff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        button.clear {
            background: #e74c3c;
        }

        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        /* 画布样式 */
        #canvas-container {
            flex-grow: 1;
            position: relative;
            cursor: crosshair;
        }

        canvas {
            display: block;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="tool-group">
            <strong>画笔颜色:</strong>
            <input type="color" id="colorPicker" value="#000000">
        </div>
        
        <div class="tool-group">
            <strong>粗细:</strong>
            <input type="range" id="lineWidth" min="1" max="20" value="5">
        </div>

        <div class="tool-group">
            <button id="clearBtn" class="clear">清空画布</button>
            <button id="saveBtn">保存为图片</button>
        </div>
        
        <span style="margin-left: auto; color: #888; font-size: 14px;">鼠标左键绘画 | 触摸屏可用</span>
    </div>

    <div id="canvas-container">
        <canvas id="whiteboard"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const lineWidthInput = document.getElementById('lineWidth');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        let painting = false;

        // 初始化画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - document.querySelector('.toolbar').offsetHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 绘画逻辑
        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function finishedPosition() {
            painting = false;
            ctx.beginPath(); // 重置路径，防止线条连接到点击处
        }

        function draw(e) {
            if (!painting) return;

            // 处理触摸和鼠标坐标
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineWidth = lineWidthInput.value;
            ctx.lineCap = 'round';
            ctx.strokeStyle = colorPicker.value;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // 事件监听
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);

        // 移动端支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startPosition(e);
        }, { passive: false });
        canvas.addEventListener('touchend', finishedPosition);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        }, { passive: false });

        // 功能按钮
        clearBtn.addEventListener('click', () => {
            if(confirm('确定要清空画布吗？')) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'my-drawing.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
